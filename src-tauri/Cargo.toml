[package]
name = "automixer"
version = "0.1.0"
description = "Chat-first assisted mixing room"
authors = ["AutoMixer"]
edition = "2021"
default-run = "automixer"

[lib]
name = "automixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arc-swap = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
crossbeam-channel = "0.5"
dirs = "6"
hound = "3"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking"] }
futures-util = "0.3"
realfft = "3"
rtrb = "0.3"
rubato = "0.16"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats", "wav", "flac", "mp3", "aac", "ogg", "isomp4"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-window-state = "2"

[profile.dev]
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
