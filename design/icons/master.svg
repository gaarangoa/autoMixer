<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163842"/>
      <stop offset="0.5" stop-color="#0f2530"/>
      <stop offset="1" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8df6ff"/>
      <stop offset="0.5" stop-color="#3fd2f0"/>
      <stop offset="1" stop-color="#1fa6d8"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="capGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle body -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#vign)"/>
  <!-- top sheen -->
  <rect x="32" y="32" width="960" height="300" rx="224" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- three fader slots with tick notches -->
  <g>
    <rect x="312" y="244" width="16" height="536" rx="8" fill="#03090c" fill-opacity="0.7"/>
    <rect x="504" y="244" width="16" height="536" rx="8" fill="#03090c" fill-opacity="0.7"/>
    <rect x="696" y="244" width="16" height="536" rx="8" fill="#03090c" fill-opacity="0.7"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="3">
    <line x1="300" y1="380" x2="724" y2="380"/>
    <line x1="300" y1="512" x2="724" y2="512"/>
    <line x1="300" y1="644" x2="724" y2="644"/>
  </g>

  <!-- caps (different heights -> "mix") -->
  <g filter="url(#capGlow)">
    <rect x="264" y="556" width="112" height="64" rx="16" fill="url(#cap)"/>
    <rect x="456" y="324" width="112" height="64" rx="16" fill="url(#cap)"/>
    <rect x="648" y="452" width="112" height="64" rx="16" fill="url(#cap)"/>
  </g>
  <!-- cap center lines + top highlight -->
  <g>
    <rect x="264" y="585" width="112" height="6" rx="3" fill="#04222b" fill-opacity="0.8"/>
    <rect x="456" y="353" width="112" height="6" rx="3" fill="#04222b" fill-opacity="0.8"/>
    <rect x="648" y="481" width="112" height="6" rx="3" fill="#04222b" fill-opacity="0.8"/>
    <rect x="264" y="562" width="112" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="456" y="330" width="112" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="648" y="458" width="112" height="10" rx="5" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- AI sparkle, upper-right -->
  <g filter="url(#starGlow)">
    <path d="M752 214
             C763 286 782 305 854 316
             C782 327 763 346 752 418
             C741 346 722 327 650 316
             C722 305 741 286 752 214 Z" fill="url(#star)"/>
    <path d="M858 196 C862 222 868 228 894 232 C868 236 862 242 858 268 C854 242 848 236 822 232 C848 228 854 222 858 196 Z" fill="url(#star)"/>
  </g>
</svg>
