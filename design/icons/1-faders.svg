<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a2e"/>
      <stop offset="0.55" stop-color="#121a1d"/>
      <stop offset="1" stop-color="#0a0e10"/>
    </linearGradient>
    <linearGradient id="cap1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff0c8"/>
      <stop offset="1" stop-color="#16b48a"/>
    </linearGradient>
    <filter id="glow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg1)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- three fader slots -->
  <g>
    <rect x="300" y="230" width="14" height="564" rx="7" fill="#000000" fill-opacity="0.55"/>
    <rect x="505" y="230" width="14" height="564" rx="7" fill="#000000" fill-opacity="0.55"/>
    <rect x="710" y="230" width="14" height="564" rx="7" fill="#000000" fill-opacity="0.55"/>
  </g>
  <!-- caps -->
  <g filter="url(#glow1)">
    <rect x="258" y="300" width="98" height="58" rx="14" fill="url(#cap1)"/>
    <rect x="463" y="520" width="98" height="58" rx="14" fill="url(#cap1)"/>
    <rect x="668" y="410" width="98" height="58" rx="14" fill="url(#cap1)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="258" y="325" width="98" height="6" rx="3"/>
    <rect x="463" y="545" width="98" height="6" rx="3"/>
    <rect x="668" y="435" width="98" height="6" rx="3"/>
  </g>
</svg>
